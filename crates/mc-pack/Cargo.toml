[package]
name = "mc-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Installe un pack décrit par un manifeste JSON : Java, jeu, chargeur et mods"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
mc-log = { path = "../mc-log" }
mc-auth = { path = "../mc-auth" }
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
mc-dl = { path = "../mc-dl" }
mc-java = { path = "../mc-java" }
mc-mods = { path = "../mc-mods" }
mc-instance = { path = "../mc-instance" }

[[bin]]
name = "mc-pack"
path = "src/main.rs"
