[package]
name = "mc-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Installe un pack décrit par un manifeste JSON : Java, jeu, chargeur et mods"

[dependencies]
mc-paths = { path = "../mc-paths" }
anyhow.workspace = true
tracing.workspace = true
mutants.workspace = true
mc-log = { path = "../mc-log" }
mc-auth = { path = "../mc-auth" }
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
mc-dl = { path = "../mc-dl" }
mc-java = { path = "../mc-java" }
mc-mods = { path = "../mc-mods" }
mc-instance = { path = "../mc-instance" }

[[bin]]
name = "mc-pack"
path = "src/main.rs"

[dev-dependencies]
mc-testkit = { path = "../mc-testkit" }

# Le transport de test du SDK : il retient les incidents au lieu de les
# envoyer. Sans lui, ce qui part chez Sentry quand le jeu plante ne se
# vérifierait qu'en lisant le tableau de bord, une fois l'incident survenu
# chez un joueur.
sentry = { workspace = true, features = ["test"] }
