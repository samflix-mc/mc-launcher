# Réglages des tests de mutation (voir .github/workflows/mutation.yml).
#
# Ce que cargo-mutants ne doit pas muter — et la raison, qui est la seule
# chose qui vaille dans un fichier d'exclusions.

exclude_globs = [
    # mc-essais est l'outillage des suites : un serveur HTTP local, de faux
    # runtimes, des archives fabriquées. Le muter reviendrait à demander
    # qu'un test vérifie le harnais d'un autre test — et le résultat serait
    # un survivant par méthode, indéfiniment, sur du code que `publish =
    # false` interdit d'embarquer dans un binaire. Ce qui compte pour ce
    # crate, c'est que les suites qui s'en servent tombent quand il ment ;
    # c'est déjà ce qu'elles font.
    "crates/mc-essais/**",
]

# Les suites vivent dans des fichiers « <module>.test.rs » compilés sous
# #[cfg(test)] : cargo-mutants les ignore déjà de lui-même, rien à déclarer.

# --- Mutants équivalents ----------------------------------------------------
#
# Ceux-ci ne changent pas ce que le programme fait. Aucun test ne peut les
# tuer, parce qu'il n'y a rien à distinguer : les écarter n'est pas une
# dispense, c'est constater qu'il n'y a pas de question. Chacun est justifié,
# et chaque justification est vérifiable en lisant le code cité.
#
# Les motifs ne portent jamais de numéro de ligne : une exclusion attachée à
# une ligne se détache au premier déplacement du code, et l'on se retrouve à
# tolérer un mutant qui, lui, compte.
exclude_re = [
    # `EventFilter::Event | EventFilter::Log` — un « ou binaire » entre deux
    # drapeaux distincts. Le « ou exclusif » ne s'en écarte que si les deux
    # bits sont posés ensemble, ce qui ne peut pas arriver entre deux
    # constantes différentes. Même valeur, donc même comportement.
    "couche\\.rs.*replace \\| with \\^",

    # `hash[6] = (hash[6] & 0x0f) | 0x30` — le masque met à zéro les bits que
    # la constante rajoute. Sur des bits à zéro, « ou » et « ou exclusif »
    # donnent le même résultat. C'est la version 3 de l'UUID, et elle sort
    # identique dans les deux cas.
    "hors_ligne\\.rs.*replace \\| with \\^",

    # `age > limit` en `>=` — la différence se joue sur un journal dont l'âge
    # vaut la limite à la nanoseconde près. Un test qui prétendrait la
    # provoquer mesurerait l'ordonnanceur, pas la purge.
    "journal\\.rs.*replace > with >= in purge_old_logs",

    # `Some(home) if text.contains(home)` — la garde n'est qu'un raccourci :
    # `text.replace(home, "~")` sur un texte qui ne contient pas `home` rend
    # ce texte inchangé. Forcer la garde à vraie donne la même sortie, pour un
    # peu plus de travail.
    "home\\.rs.*replace match guard text.contains\\(home\\) with true",

    # `while i < text.len()` en `<=` — au tour de trop, `lower[i..]` est vide,
    # aucun mot-clé n'y commence, et `text[i..].chars().next()` rend `None`,
    # donc la boucle sort par son `break`. Une itération de plus qui ne fait
    # rien et n'écrit rien.
    "mot_cle\\.rs.*replace < with <= in redact_after_keywords",
]

# Le temps par mutant se déduit de la suite non mutée. Le multiplicateur par
# défaut (le double) est trop serré ici : plusieurs tests écrivent un
# exécutable puis le lancent, et mc-java sérialise ces essais derrière un
# verrou. Un plancher d'une minute empêche par ailleurs qu'une suite très
# rapide ne donne un délai que la charge d'un runner suffirait à dépasser —
# un mutant déclaré « en dépassement » n'est pas un mutant tué.
timeout_multiplier = 6.0
minimum_test_timeout = 60
