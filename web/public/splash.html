      /*
        Everything is here, hardcoded, and that's the point of this file.

        This window exists to show BEFORE Angular exists. It can therefore
        depend on nothing produced by the build: not the design system's
        sheet, not a font file. The slightest `<link>` to a file would add an
        asset-protocol round trip between the window opening and its first
        render — exactly the gap this exists to close.

        ## The inline style, and why it clears the CSP

        Tauri injects a nonce into every `<style>` tag it finds in the
        embedded HTML, and the level-3 CSP rule says a nonce cancels
        `'unsafe-inline'`. That's exactly the situation
        `dangerousDisableAssetCspModification: ["style-src"]` was set to
        cover: the `style-src` directive isn't rewritten, so
        `'unsafe-inline'` stays in effect and this block applies.

        If this file ever went blank, that's the first thing to check.

        ## The font, in base64, and why it's worth it

        The design system's wordmark is in Pixelify Sans. Serving it as a
        file would render the first pass in the system font, then jump to
        the right one — on a window that lasts a second, that's the only
        motion you'd see. Eleven kilobytes in base64 remove both the round
        trip AND the jump. The subset is latin, weight 500: the only one the
        design system allows for this face.

        ## The values are copied from `src/design/tokens.css`

        They can't be imported: this file has no sheet. They have to be
        carried over by hand the day the design system is republished —
        that's the price of a window that opens instantly, and it's paid
        once per redesign.
      */

      :root {
        color-scheme: dark;
        --bg: #0d0c0a;
        --bg-raised: #161411;
        --ink: #f4efe6;
        --ink-2: #cbc4b8;
        --ink-3: #b3aca1;
        --gold: #e6b54a;
        --gold-bright: #f6d27a;
        --gold-deep: #b8862b;
        --field: #0d0c0a73;
        --glass-line: #ffffff29;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        /* The SAME color as the window's `backgroundColor` and the design
           system's `--bg-raised`. The two must match: that's what makes
           none of the transitions visible. */
        background: var(--bg-raised);
        color: var(--ink);
        font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
        /* The window has no decorations and no buttons: nothing in it
           should be selectable, and the cursor shouldn't promise anything. */
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      /* The design system's `.hm-splash`: a centered, vertical stack with a
         golden glow behind it. Portrait by design, like a game client's
         loader — the wordmark in the upper half, the bar below it. */
      .splash {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 24px;
        padding: 32px;
        box-sizing: border-box;
        overflow: hidden;
        /* A border, because without decorations the window has no edge at all. */
        border: 1px solid rgb(255 255 255 / 0.08);
      }

      .splash::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 30%;
        width: 160%;
        height: 90%;
        transform: translateX(-50%);
        background: radial-gradient(50% 50% at 50% 50%, rgb(230 181 74 / 0.14), transparent 70%);
        pointer-events: none;
      }

      .splash > * {
        position: relative;
      }

      .wordmark {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        margin: 0;
        font-family: 'Pixelify Sans', monospace;
        font-weight: 500;
        font-size: 44px;
        line-height: 48px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        max-width: 100%;
        overflow-wrap: anywhere;
        text-align: center;
      }

      .wordmark span {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: var(--gold);
        align-self: flex-end;
        margin-bottom: 6px;
        box-shadow: 0 0 16px rgb(230 181 74 / 0.6);
        flex: none;
      }

      /* The track, indeterminate: at this instant nobody knows how long the
         manifest and the session will take, and a bar climbing at a made-up
         pace would lie. */
      .track {
        position: relative;
        width: 220px;
        height: 8px;
        border-radius: 999px;
        background: var(--field);
        box-shadow:
          inset 0 1px 2px rgb(0 0 0 / 0.35),
          0 1px 0 rgb(255 255 255 / 0.06);
        overflow: hidden;
      }

      .track::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright));
        animation: slide 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      @keyframes slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--ink-2);
      }

      .circle {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid var(--glass-line);
        border-top-color: var(--gold);
        animation: spin 0.8s linear infinite;
        flex: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .footer {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 12px;
        display: flex;
        justify-content: flex-end;
        font:
          400 11px/16px 'JetBrains Mono',
          'Cascadia Mono',
          Consolas,
          monospace;
        color: var(--ink-3);
      }

      /* A bar that slides forever is exactly what "reduced motion" asks to
         avoid. We freeze it and stretch it out: it then says "something is
         happening" without moving anything. */
      @media (prefers-reduced-motion: reduce) {
        .track::after {
          animation: none;
          left: 0;
          width: 100%;
          opacity: 0.6;
        }
        .circle {
          animation-duration: 1.5s;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <h1 class="wordmark">Helm<span aria-hidden="true"></span></h1>
      <div class="track" role="progressbar" aria-label="Starting"></div>
      <div class="status">
        <span class="circle" aria-hidden="true"></span>Starting the launcher…
      </div>
      <div class="footer"><span>samflix-mc</span></div>
    </div>
  </body>
</html>
