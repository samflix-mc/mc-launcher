<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>samflix-mc</title>
    <style>
      /*
        Tout est ici, en dur, et c'est le sujet de ce fichier.

        Cette fenêtre existe pour s'afficher AVANT qu'Angular n'existe. Elle ne
        peut donc dépendre d'aucun morceau produit par le build : ni la feuille
        Tailwind, ni daisyUI, ni une police. Le moindre `<link>` vers un fichier
        ajouterait un aller-retour du protocole d'actifs entre l'ouverture de la
        fenêtre et son premier rendu — c'est-à-dire exactement le trou qu'on
        cherche à combler.

        ## Le style en ligne, et pourquoi il passe le CSP

        Tauri injecte un nonce dans toute balise `<style>` qu'il trouve dans le
        HTML embarqué, et la règle du CSP niveau 3 veut qu'un nonce annule
        `'unsafe-inline'`. C'est précisément la situation que
        `dangerousDisableAssetCspModification: ["style-src"]` a été posé pour
        couvrir : la directive `style-src` n'est pas réécrite, donc
        `'unsafe-inline'` reste effectif et ce bloc s'applique.

        Si ce fichier devenait blanc un jour, c'est la première chose à
        vérifier.
      */
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        /* La MÊME couleur que `backgroundColor` de la fenêtre et que le fond de
           l'interface. Les trois doivent coïncider : c'est ce qui fait qu'aucune
           des transitions ne se voit. */
        background: #191c22;
        color: #eef1f5;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        /* La fenêtre n'a ni décorations ni boutons : rien ne doit s'y
           sélectionner, et le curseur ne doit rien promettre. */
        user-select: none;
        cursor: default;
        /* Un liseré, parce que sans décorations la fenêtre n'a aucun bord.
           Sur un fond de bureau sombre, elle se fondrait dedans. */
        box-sizing: border-box;
        border: 1px solid rgb(255 255 255 / 0.08);
      }

      .pile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      /* Le sceau, identique à celui de la barre de titre et de l'amorce
         Angular : c'est ce qui rend le passage d'une fenêtre à l'autre
         invisible. */
      .sceau {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: #5b8731;
        color: #f7fbf4;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 6px 18px rgb(0 0 0 / 0.35);
      }

      .nom {
        font-size: 15px;
        font-weight: 500;
      }

      /*
        Un anneau qui tourne.

        Une bordure dont un seul côté est coloré, mise en rotation : la figure
        se lit comme une attente indéterminée sans rien promettre sur sa durée,
        là où trois points qui pulsent se lisent plutôt comme « il se passe
        quelque chose de discret ».

        En CSS pur, sans SVG ni image : ce fichier ne charge aucun fichier
        externe, c'est toute sa raison d'être.
      */
      .anneau {
        width: 26px;
        height: 26px;
        border: 3px solid rgb(255 255 255 / 0.12);
        border-top-color: #7cb342;
        border-radius: 50%;
        animation: tourne 0.8s linear infinite;
      }

      @keyframes tourne {
        to {
          transform: rotate(360deg);
        }
      }

      /* Ce que « mouvement réduit » demande : la figure reste, elle ne tourne
         plus. L'anneau incomplet suffit à dire qu'on attend. */
      @media (prefers-reduced-motion: reduce) {
        .anneau {
          animation: none;
        }
      }

      .phrase {
        font-size: 12px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="pile">
      <div class="sceau">SA</div>
      <div class="nom">samflix-mc</div>
      <div class="anneau" role="status" aria-label="Démarrage en cours"></div>
      <!--
        Une phrase fixe, et non tirée au sort.

        Le tirage demanderait du JavaScript, donc un script à charger, donc
        l'aller-retour qu'on évite. La variété est le travail de l'amorce
        Angular, qui prend le relais et qui, elle, a déjà tout chargé.
      -->
      <div class="phrase">Démarrage…</div>
    </div>
  </body>
</html>
