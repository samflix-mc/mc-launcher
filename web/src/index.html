<!doctype html>
<html lang="fr" data-theme="dark" data-fond="spawn">
  <head>
    <meta charset="utf-8" />
    <title>Helm</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Le fond, préchargé.

      Sans cela, la photographie arrive APRÈS le premier rendu et produit un
      flash — à l'endroit précis que l'amorce existe pour couvrir.

      `fetchpriority="high"` : sans lui, le navigateur classe une image de fond
      après les scripts, et le préchargement arriverait trop tard pour servir.
    -->
    <link rel="preload" as="image" href="fonds/spawn.webp" fetchpriority="high" />
  </head>
  <body>
    <!--
      L'amorce STATIQUE : ce qui s'affiche avant qu'Angular n'ait démarré.

      Angular vide `<app-root>` au bootstrap (`el.textContent = ''`), dans la
      même tâche que son premier rendu : ce bloc disparaît donc exactement
      quand le composant d'amorce prend le relais, sans transition visible et
      sans qu'on ait rien à orchestrer.

      Elle est dessinée avec les classes du design system — `.hm-splash`,
      `.hm-wordmark`, `.hm-spinner` — c'est-à-dire EXACTEMENT celles de la
      fenêtre d'écran de démarrage de Tauri et celles de l'amorce Angular. Les
      trois écrans se succèdent sans qu'aucun passage ne se voie, et il n'y a
      qu'un seul dessin à tenir à jour.

      Le nom est écrit en dur, et il ne peut pas l'être autrement : `marque()`
      est une commande Rust, et à cet instant il n'y a ni pont ni JavaScript. Si
      `MC_LAUNCHER_NOM` change à la compilation, c'est la seule ligne du front
      qui ne suivra pas — l'amorce Angular, elle, affiche la vraie.
    -->
    <app-root>
      <div class="hm-splash" style="height: 100%">
        <h1 class="hm-wordmark">Helm<span class="hm-wordmark__dot"></span></h1>
        <div class="hm-splash__status">
          <span class="hm-spinner hm-spinner--sm"></span>Démarrage…
        </div>
      </div>
    </app-root>
  </body>
</html>
