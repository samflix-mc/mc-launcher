<div data-test="amorce" class="grid h-full place-items-center" role="status" aria-live="polite">
  <div class="flex flex-col items-center gap-5">
    <!--
      Le sceau tient lieu de logo : deux lettres tirées du nom, exactement
      comme dans la barre de titre. Une image demanderait un fichier de plus à
      précharger sur l'écran dont le seul travail est de ne pas faire attendre.
    -->
    <div
      class="grid size-20 place-items-center rounded-box bg-primary text-2xl font-bold text-primary-content shadow-lg"
      aria-hidden="true"
      data-test="sceau"
    >
      {{ marque().sceau }}
    </div>

    <p class="text-lg font-medium" data-test="nom">{{ marque().nom }}</p>

    <!--
      Le chargeur, SOUS le logo — comme demandé. `loading-dots` de daisyUI :
      trois points qui pulsent, sans rien à charger.
    -->
    <span class="loading loading-dots loading-md text-primary" data-test="chargeur"></span>

    <!-- Et la phrase, sous le chargeur. -->
    <p class="text-sm opacity-60" data-test="phrase">{{ phrase() ?? parDefaut }}</p>
  </div>
</div>
