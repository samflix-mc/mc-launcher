<!--
  Le dessin du design system : le mot-symbole dans la moitié haute, la barre
  sous lui, le statut sous la barre. Pas de titre de page, pas de bouton — rien
  d'autre que l'attente.
-->
<div class="hm-splash" role="status" aria-live="polite" data-test="amorce">
  <h1 class="hm-wordmark" data-test="nom">
    {{ marque().nom }}<span class="hm-wordmark__dot" aria-hidden="true"></span>
  </h1>

  <!--
    Indéterminée : à cet instant, l'amorce attend le RÉSEAU, et personne ne sait
    combien de temps cela prend. Une barre qui monterait à un rythme inventé
    mentirait, et c'est précisément ce qu'une jauge existe pour ne pas faire.
  -->
  <div class="hm-progress hm-progress--lg hm-splash__progress">
    <div class="hm-progress__track">
      <div class="hm-progress__fill hm-progress__fill--indeterminate" data-test="progression"></div>
    </div>
  </div>

  <div class="hm-splash__status" data-test="phrase">
    <span class="hm-spinner hm-spinner--sm" aria-hidden="true"></span>
    {{ phrase() ?? parDefaut }}
  </div>
</div>
