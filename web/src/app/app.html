<!--
  La charpente : une colonne, barre de titre en haut, le reste dessous.

  Rien ici ne porte d'image de fond : le fond plein cadre vit sur `body`, qui
  est la seule surface couvrant la fenêtre entière, barre de titre comprise.
-->
<div class="flex h-screen flex-col" data-test="coque">
  <!--
    AU-DESSUS de l'amorce, et c'est délibéré : pendant les deux allers-retours
    réseau de `statut()`, la fenêtre doit garder ses boutons. Sans quoi, sur un
    réseau lent ou derrière un portail captif, il n'y aurait aucun moyen de
    fermer.
  -->
  <app-barre-titre />

  @if (amorce()) {
    <div class="min-h-0 flex-1">
      <app-amorce />
    </div>
  } @else {
    <!--
      `data-flou` porte sur la ZONE DE CONTENU et non sur la coque : flouter la
      coque flouterait l'overlay avec elle, puisqu'il en est un descendant.
    -->
    <div class="flex min-h-0 flex-1" [attr.data-flou]="flou()" data-test="contenu">
      <app-menu />

      <!--
        `min-h-0` sur le conteneur ET `overflow-y-auto` ici : sans le premier,
        un enfant flex refuse de rétrécir sous sa taille de contenu, et la page
        déborde par le bas au lieu de défiler.
      -->
      <main class="min-h-0 flex-1 overflow-y-auto" data-test="page">
        @if (!disponible) {
          <!--
            Hors de la fenêtre Tauri — `ng serve` seul. L'écran le dit plutôt
            que d'échouer sur un `invoke` qui n'existe pas.
          -->
          <div class="m-6 alert alert-warning" data-test="hors-tauri">
            <span>
              Cette page est ouverte hors du launcher : aucune commande n'est joignable. Lancer
              <code>cargo tauri dev</code> pour la fenêtre complète.
            </span>
          </div>
        }
        <router-outlet />
      </main>
    </div>
  }
</div>

<!--
  HORS de la zone floutée, et hors du menu.

  Le menu porte un `backdrop-filter`, qui crée un contexte d'empilement et fait
  de lui un bloc conteneur pour ses descendants en `position: fixed` : un
  overlay monté dedans serait borné à ses cent quatre-vingts pixels de large.
-->
<app-overlay />
