<nav class="hm-nav" aria-label="Sections du launcher" data-test="nav">
  @for (onglet of onglets; track onglet.chemin) {
    <!--
      `routerLinkActive` pose l'attribut, que le STYLE lit — le design system
      s'appuie sur `[aria-current="page"]` pour la pilule claire et l'icône
      dorée — et que les tests lisent aussi. C'est la famille d'attributs qui
      est un contrat des deux côtés.
    -->
    <a
      class="hm-nav__item"
      [routerLink]="onglet.chemin"
      routerLinkActive
      #actif="routerLinkActive"
      [attr.aria-current]="actif.isActive ? 'page' : null"
      [attr.data-test]="'onglet-' + onglet.libelle.toLowerCase()"
    >
      <lucide-icon [img]="onglet.icone" [size]="20" [strokeWidth]="1.75" aria-hidden="true" />
      {{ onglet.libelle }}
    </a>
  }
</nav>
