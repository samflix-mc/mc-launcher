<!--
  `data-tauri-drag-region` sur la barre entière : c'est lui qui la rend
  saisissable. Les boutons sont écartés par le script de Tauri lui-même, sans
  qu'on ait à neutraliser leurs pointeurs.
-->
<div
  class="hm-titlebar"
  [class.hm-titlebar--dialog]="dialogue()"
  [class.hm-titlebar--glass]="dialogue()"
  data-tauri-drag-region
  data-test="barre-titre"
>
  <span class="hm-titlebar__title" data-tauri-drag-region>
    <span class="hm-titlebar__brand" data-tauri-drag-region data-test="titre">
      {{ marque().nom }}
    </span>
    @if (pack(); as nom) {
      <span class="hm-titlebar__sep" data-tauri-drag-region aria-hidden="true"></span>
      <span data-tauri-drag-region data-test="pack">{{ nom }}</span>
    }
  </span>

  <!--
    La cloche. Trente-deux pixels et non quarante-six : ce n'est pas un bouton
    de légende, et le design system le distingue pour cette raison.
  -->
  @if (!dialogue()) {
    <div class="hm-titlebar__tools">
      <button
        type="button"
        class="hm-bell"
        (click)="basculerNotifications()"
        [attr.aria-expanded]="panneauOuvert()"
        aria-label="Notifications"
        title="Notifications"
        data-test="cloche"
      >
        <lucide-icon [img]="Bell" [size]="16" [strokeWidth]="1.75" aria-hidden="true" />
        @if (nonLus() > 0) {
          <!-- Cachée à zéro : une pastille qui dit « 0 » demande à être lue pour
               apprendre qu'il n'y a rien. -->
          <span class="hm-bell__count" data-test="non-lus">{{ nonLus() }}</span>
        }
      </button>
    </div>
  }

  <!--
    Les trois boutons du système. Leurs permissions ne sont PAS dans
    core:window:default : elles sont déclarées nommément dans
    capabilities/default.json, et leur absence se voit en build packagé
    seulement.
  -->
  <div class="hm-winctl">
    <button
      type="button"
      class="hm-winctl__btn hm-winctl__btn--min"
      (click)="reduire()"
      data-test="reduire"
      aria-label="Réduire la fenêtre"
      title="Réduire"
    >
      <lucide-icon [img]="Minus" [size]="12" [strokeWidth]="1.5" aria-hidden="true" />
    </button>

    <button
      type="button"
      class="hm-winctl__btn hm-winctl__btn--max"
      (click)="basculer()"
      data-test="maximiser"
      [attr.aria-label]="maximisee() ? 'Restaurer la fenêtre' : 'Agrandir la fenêtre'"
      [title]="maximisee() ? 'Restaurer' : 'Agrandir'"
    >
      <!--
        Deux icônes distinctes : « restaurer » n'est pas « agrandir », et un
        même carré pour les deux obligerait le joueur à cliquer pour savoir.
      -->
      <lucide-icon
        [img]="maximisee() ? Copy : Square"
        [size]="12"
        [strokeWidth]="1.5"
        aria-hidden="true"
      />
    </button>

    <button
      type="button"
      class="hm-winctl__btn hm-winctl__btn--close"
      (click)="fermer()"
      data-test="fermer"
      aria-label="Fermer le launcher"
      title="Fermer"
    >
      <lucide-icon [img]="X" [size]="12" [strokeWidth]="1.5" aria-hidden="true" />
    </button>
  </div>
</div>
