@if (compte(); as joueur) {
  <div class="hm-joueur" data-test="joueur">
    @if (menuOuvert()) {
      <!--
        La couche qui referme au premier clic ailleurs.

        Un `document:click` sur l'hôte marcherait aussi, mais il faudrait
        distinguer le clic qui OUVRE du clic qui ferme, sous peine que le menu
        se referme dans la même tâche que son ouverture. Une couche est plus
        courte à lire, et elle bloque en plus les clics sur ce qu'elle couvre —
        ce qu'un menu ouvert doit faire.
      -->
      <button
        type="button"
        class="hm-joueur__voile"
        (click)="fermerMenu()"
        aria-label="Fermer le menu du compte"
        tabindex="-1"
      ></button>

      <div class="hm-menu hm-joueur__menu" role="menu" data-test="menu-compte">
        <p class="hm-menu__label">{{ joueur.pseudo }}</p>

        <button
          type="button"
          class="hm-menu__item"
          role="menuitem"
          (click)="rafraichir()"
          [disabled]="occupe()"
          data-test="rafraichir"
        >
          <lucide-icon [img]="RefreshCw" [size]="16" [strokeWidth]="2" aria-hidden="true" />
          Rafraîchir la session
        </button>

        <div class="hm-menu__sep" role="separator"></div>

        <button
          type="button"
          class="hm-menu__item hm-menu__item--danger"
          role="menuitem"
          (click)="deconnecter()"
          [disabled]="occupe()"
          data-test="deconnexion"
        >
          <lucide-icon [img]="LogOut" [size]="16" [strokeWidth]="2" aria-hidden="true" />
          Se déconnecter
        </button>
      </div>
    }

    <button
      type="button"
      class="hm-player"
      (click)="basculerMenu()"
      [attr.aria-expanded]="menuOuvert()"
      aria-haspopup="menu"
      data-test="badge-joueur"
    >
      <span class="hm-player__head">
        @if (tete(); as url) {
          @if (!teteAbsente()) {
            <!--
              `(error)` et non un `onerror` : hors ligne, ou si l'hôte des têtes
              est injoignable, l'image casse et le badge afficherait le carré
              vide d'une image manquante. On retombe sur le cube.
            -->
            <img
              [src]="url"
              [alt]="'Tête de ' + joueur.pseudo"
              width="40"
              height="40"
              loading="lazy"
              (error)="teteAbsente.set(true)"
              data-test="tete"
            />
          }
        }
        @if (!tete() || teteAbsente()) {
          <!-- Le cube neutre du design system : ni visage, ni personnage. -->
          <svg viewBox="0 0 40 40" aria-hidden="true" data-test="tete-absente">
            <rect width="40" height="40" fill="#2a2620" />
            <path d="M8 14l12-6 12 6-12 6z" fill="#8f887d" />
            <path d="M8 14v12l12 6V20z" fill="#5c5750" />
            <path d="M32 14v12l-12 6V20z" fill="#403c36" />
          </svg>
        }
      </span>

      <span class="hm-player__text">
        <span class="hm-player__name" data-test="pseudo">{{ joueur.pseudo }}</span>
        <span class="hm-player__state">Connecté</span>
      </span>

      <lucide-icon
        class="hm-player__chevron"
        [img]="ChevronDown"
        [size]="16"
        [strokeWidth]="2"
        aria-hidden="true"
      />
    </button>
  </div>
}
