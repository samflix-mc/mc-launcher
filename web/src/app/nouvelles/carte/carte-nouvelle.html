<a
  routerLink="/nouvelles"
  class="card border border-white/10 bg-base-100/40 verre transition-colors hover:bg-base-100/55"
  data-test="carte-nouvelle"
>
  <div class="card-body gap-2 py-4">
    <div class="flex items-baseline gap-2">
      <span class="badge badge-xs badge-primary" aria-hidden="true"></span>
      <h2 class="card-title text-base" data-test="titre">{{ billet().titre }}</h2>
      @if (billet().epinglee) {
        <span class="badge badge-xs badge-outline" data-test="epinglee">épinglée</span>
      }
      <span class="ml-auto text-xs opacity-60" data-test="date">{{ quand() }}</span>
    </div>

    @if (extrait(); as texte) {
      <!--
        `line-clamp-2` : deux lignes, quelle que soit la longueur du billet.
        Sans borne, un premier paragraphe bavard repousserait le bouton JOUER
        hors de la fenêtre.
      -->
      <p class="line-clamp-2 text-sm opacity-75" data-test="extrait">{{ texte }}</p>
    }

    <span class="text-xs text-primary" data-test="lire-la-suite">Toutes les nouvelles →</span>
  </div>
</a>
