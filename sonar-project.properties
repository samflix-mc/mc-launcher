# Analyse SonarQube Cloud.
#
# Ce fichier ne suffit pas seul. Il demande, une fois pour toutes :
#
#   1. un projet créé sur https://sonarcloud.io, importé depuis ce dépôt
#      GitHub — l'organisation et la clé ci-dessous sont celles que Sonar
#      propose alors, et doivent correspondre au caractère près ;
#   2. l'analyse automatique DÉSACTIVÉE dans le projet
#      (Administration > Analysis Method), sans quoi Sonar analyse de son côté
#      et ignore le rapport de couverture envoyé par la CI ;
#   3. un secret SONAR_TOKEN dans les secrets Actions du dépôt.
#
# Tant que le secret manque, le workflow Qualité mesure la couverture, applique
# son seuil, et passe l'analyse : une CI rouge faute de compte n'apprend rien à
# personne.

sonar.projectKey=samflix-mc_mc-launcher
sonar.organization=samflix-mc

# Les suites vivent dans des fichiers « <module>.test.rs », à côté de ce
# qu'elles vérifient, mais elles restent compilées *dans* le crate par
# #[cfg(test)] #[path] : ce ne sont pas des cibles séparées. Elles sont donc
# déclarées comme sources et non sous sonar.tests, et comptent dans la
# couverture au même titre que le reste.
#
# C'est assumé : une suite est du code qu'on maintient, qui peut contenir une
# faute, et que la duplication guette autant qu'ailleurs. La lire comme du code
# analysé est la bonne lecture — et le chiffre qui en sort est mécaniquement
# plus haut que celui du seul code de production, ce qu'il faut savoir avant de
# s'en réjouir.
sonar.sources=crates
sonar.exclusions=**/target/**

# Les exemples sont des outils de mise au point qu'on lance à la main. Les
# compter dans la couverture reviendrait à réclamer des tests pour du code dont
# le rôle est déjà d'en tenir lieu.
sonar.coverage.exclusions=crates/*/examples/**

# Produit par cargo-llvm-cov dans le workflow Qualité.
sonar.rust.lcov.reportPaths=lcov.info

# --- Règles écartées, et pourquoi -------------------------------------------
#
# Écartées ICI et non « Accepted » dans le tableau de bord : une acceptation y
# est attachée à l'empreinte d'une ligne dans un fichier. Le découpage des
# crates a déplacé ce code, et les quatre acceptations posées sur main ont
# disparu avec les fichiers qui les portaient — la note de sécurité est
# retombée à D sur du code que personne n'avait touché. Versionnée, la décision
# survit au prochain déplacement, et se relit dans la revue qui la propose.

sonar.issue.ignore.multicriteria=hachage,hachage_dl

# S4790, « hachage de données faible ». Les algorithmes ne sont pas choisis :
#
#   - hors_ligne.rs — MD5 est la définition d'un UUID v3 (RFC 4122). Le serveur
#     vanilla calcule l'UUID hors-ligne par UUID.nameUUIDFromBytes() ; en
#     changer ferait un joueur différent à chaque connexion, inventaire et
#     permissions perdus ;
#   - checksum.rs — SHA-1 et MD5 sont les empreintes que Mojang et CurseForge
#     publient. Ce sont elles qu'on doit opposer au fichier reçu, faute de
#     quoi il n'y aurait plus aucune vérification. SHA-512 est déjà préféré
#     partout où la source en publie un, ce que fait Modrinth.
#
# Aucun des deux ne sert à authentifier ou à protéger un secret : l'un nomme un
# joueur, l'autre atteste qu'un téléchargement est complet.
sonar.issue.ignore.multicriteria.hachage.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hachage.resourceKey=crates/mc-auth/src/hors_ligne.rs
sonar.issue.ignore.multicriteria.hachage_dl.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hachage_dl.resourceKey=crates/mc-dl/src/checksum.rs

# S2208, « pas d'import avec joker », n'est PAS écartée. Sortir les tests dans
# des fichiers voisins avait multiplié les `use super::*` — la règle en
# signalait 54. Ils sont nommés un par un : la suite dit désormais ce qu'elle
# emprunte au module qu'elle vérifie, et un nom qui disparaît du code se voit
# dans la suite qui le réclamait encore.

# La porte de qualité arrête la CI, au lieu de commenter une fois la PR fusion-
# née. C'est elle qui porte l'exigence des 80 % : la porte « Sonar way » par
# défaut demande, sur le CODE NOUVEAU de chaque PR, au moins 80 % de couverture,
# aucune vulnérabilité, aucun point chaud de sécurité non relu, et au plus 3 %
# de lignes dupliquées.
#
# Si l'on veut davantage, c'est là-bas que cela se règle — Quality Gates dans
# l'organisation Sonar — et non ici : ce fichier ne peut pas relever une porte,
# seulement demander qu'on l'attende.
sonar.qualitygate.wait=true

# Clippy n'est pas importé, et c'est délibéré. Le workflow Contrôles le lance
# déjà avec « -D warnings » : rien ne peut atteindre main avec un avis clippy
# ouvert, et l'import ferait double emploi dans le tableau de bord. Pour l'y
# voir tout de même, produire « cargo clippy --all-targets --message-format=json »
# et le déclarer sous sonar.rust.clippyReport.reportPaths — en se méfiant du
# cache de cargo, qui ne réémet pas les avis d'une compilation déjà faite et
# enverrait alors un rapport vide sans le dire.
