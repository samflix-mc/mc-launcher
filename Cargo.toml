[workspace]
resolver = "3"
members = [
    "crates/mc-chemins",
    "crates/mc-reglages",
    "crates/mc-nouvelles",
    "crates/mc-auth",
    "crates/mc-dl",
    "crates/mc-essais",
    "crates/mc-log",
    "crates/mc-java",
    "crates/mc-mods",
    "crates/mc-instance",
    "crates/mc-pack",
    # L'application : elle n'ajoute aucune logique de launcher, elle appelle
    # les crates ci-dessus et les rend visibles dans une fenêtre.
    "crates/mc-app",
]

# Ce que « cargo build », « cargo test » ou « cargo mutants » prennent quand on
# ne leur nomme rien. La liste vaut « members » moins mc-app, et c'est le seul
# levier qui agisse sur un appelant qu'on ne contrôle pas : release.yml délègue
# à samflix-mc/.github, qui lance un « cargo build » nu. Sans cette ligne, ce
# build-là compilerait l'application — sans WebKitGTK sur son runner, et sans
# jamais empaqueter ce qu'il aurait produit.
#
# Il agit du même coup sur cargo-mutants, invoqué sans « --workspace » dans
# mutation.yml : mc-app sort du périmètre de mutation parce qu'il n'ajoute
# aucune logique — chaque étape qu'il montre est déjà mutée dans le crate qui
# la porte. Ne pas ajouter « --workspace » à mutation.yml par réflexe
# d'uniformité : ce serait défaire l'arbitrage sans le dire.
#
# Contrepartie, à tenir : « --workspace » devient explicite LÀ OÙ L'ON VEUT
# VOIR mc-app — le clippy de ci.yml et le llvm-cov de qualite.yml.
#
# Piège, et c'est le seul dont le symptôme est l'absence de symptôme : Cargo
# refuse un paquet listé ici qui ne serait pas membre, et ne dit RIEN d'un
# membre absent d'ici. Un crate neuf oublié sortirait en silence de tout ce qui
# précède. ci.yml compare donc les deux listes à chaque exécution.
default-members = [
    "crates/mc-chemins",
    "crates/mc-reglages",
    "crates/mc-nouvelles",
    "crates/mc-auth",
    "crates/mc-dl",
    "crates/mc-essais",
    "crates/mc-log",
    "crates/mc-java",
    "crates/mc-mods",
    "crates/mc-instance",
    "crates/mc-pack",
]

[workspace.package]
edition = "2024"
license = "MIT"
# Une seule version pour tout le dépôt, et c'est celle que porte le tag.
# tauri.conf.json ne la déclare plus : privé de clé « version », Tauri va la
# lire dans le Cargo.toml du crate, qui la tient d'ici. Un seul endroit à
# changer, donc aucun endroit où elle puisse diverger — et le job « coherence »
# de release.yml oppose le tag à cette ligne avant toute compilation.
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# L'attribut `#[mutants::skip]`, et rien d'autre : le crate ne contient pas une
# ligne de code exécutable, et l'attribut disparaît à la compilation. Il marque
# le peu de code qu'aucun test ne peut atteindre — ce qui parle à Microsoft par
# des adresses écrites dans une bibliothèque tierce, et ce qui ne se compile
# que sur une autre plateforme. Le fichier .cargo/mutants.toml ne pouvait pas
# s'en charger : ses exclusions ne s'appliquent pas à toutes les formes de
# mutants, et une raison écrite à côté du code se relit mieux qu'une regex.
mutants = "0.0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process"] }
md-5 = "0.10"
# `stream` pour lire un corps morceau par morceau : c'est ce qui rend un débit
# et un temps restant observables, là où `bytes()` ne rend la main qu'une fois
# le fichier entier en mémoire.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Uniquement pour dater le nom du journal du jour, exactement comme
# tracing-appender le fait : il est déjà dans l'arbre par lui.
time = { version = "0.3", default-features = false, features = ["std"] }
# rustls plutôt que native-tls, comme reqwest ailleurs : une seule pile TLS
# dans le binaire, et rien à lier au système.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    # Journaux structurés. Activés par défaut dans le SDK, mais
    # `default-features = false` les éteint — ce qu'on paie pour choisir rustls
    # plutôt que native-tls.
    "logs",
] }
sentry-tracing = { version = "0.49", features = ["logs"] }

# L'application. Tauri 2 et non 3 : au 17/09/2026 la 3.x est en alpha, sans
# guide de migration, et ne change rien au rendu WebKitGTK sous Linux — voir
# docs/interface.md.
tauri = { version = "2.11", features = [] }
tauri-build = "2.6"
tauri-plugin-opener = "2"
# Le trousseau du système, où vit la session du joueur.
keyring = "4"
