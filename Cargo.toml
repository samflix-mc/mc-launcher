[workspace]
resolver = "3"
members = [
    "crates/mc-auth",
    "crates/mc-dl",
    "crates/mc-log",
    "crates/mc-java",
    "crates/mc-mods",
    "crates/mc-instance",
    "crates/mc-pack",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Uniquement pour dater le nom du journal du jour, exactement comme
# tracing-appender le fait : il est déjà dans l'arbre par lui.
time = { version = "0.3", default-features = false, features = ["std"] }
# rustls plutôt que native-tls, comme reqwest ailleurs : une seule pile TLS
# dans le binaire, et rien à lier au système.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    # Journaux structurés. Activés par défaut dans le SDK, mais
    # `default-features = false` les éteint — ce qu'on paie pour choisir rustls
    # plutôt que native-tls.
    "logs",
] }
sentry-tracing = { version = "0.49", features = ["logs"] }
