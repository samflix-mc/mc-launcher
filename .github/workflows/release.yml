name: Release

# Publie les binaires sur tag. Les runners GitHub sont gratuits et illimités
# sur les dépôts publics, macOS compris — c'est ce qui rend la matrice
# multi-plateforme indolore ici.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Les binaires publiés sur tag sont les seuls à porter « production ».
# Sans cette déclaration ils retomberaient sur « local », le défaut prudent :
# un incident de production classé en local se remarque, l'inverse pollue
# silencieusement le seul environnement qu'on surveille.
env:
  SAMFLIX_ENV: production

# mc-pack et non mc-auth : le binaire publié doit être celui qu'on lance.
# mc-auth est une brique d'authentification, utile à qui développe, sans usage
# pour un joueur — et elle attend toujours l'approbation Azure. mc-pack, lui,
# installe le pack, vérifie l'installation et lance le jeu ; c'est la commande
# dont l'existence justifie ce dépôt.
jobs:
  release:
    uses: samflix-mc/.github/.github/workflows/release-rust.yml@main
    with:
      binary: mc-pack
    permissions:
      contents: write
