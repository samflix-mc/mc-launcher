name: Contrôles

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# L'environnement suit ce que la CI construit : la branche principale prépare
# une publication, tout le reste est du travail en cours. Le tag de production
# est posé par le workflow de release, jamais ici.
env:
  SAMFLIX_ENV: ${{ github.ref == 'refs/heads/main' && 'preproduction' || 'development' }}

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Vérifier que le binaire démarre
        run: |
          # « login » demande un code d'appareil à Microsoft, l'affiche, puis
          # attend une validation qui ne viendra pas ici : le code reçu prouve
          # que la chaîne HTTP fonctionne de bout en bout, sans exiger de compte
          # ni de secret dans la CI. C'est ce que vérifiait l'ancien
          # AADSTS700038, du temps où le binaire prenait un identifiant
          # d'application en argument ; l'identité est désormais celle du
          # launcher officiel, et il n'y a plus d'argument à salir pour
          # provoquer un refus.
          #
          # Le délai coupe l'attente, et non la requête : celle-ci répond en
          # moins de deux secondes, ou la CI a mieux à signaler qu'un code.
          out=$(timeout 60 ./target/release/mc-auth login 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "microsoft.com/link?otc=" \
            || { echo "::error::réponse inattendue de Microsoft"; exit 1; }
