name: Qualité

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Le même environnement que les contrôles. Plusieurs tests lisent SAMFLIX_ENV,
  # et une couverture mesurée ailleurs ne couvre pas le même code.
  SAMFLIX_ENV: ${{ github.ref == 'refs/heads/main' && 'preproduction' || 'development' }}

  # Le cliquet, et non l'objectif. Il interdit de redescendre, et se remonte à
  # mesure qu'on monte — jamais l'inverse.
  #
  # Quatre-vingt-dix pour un dépôt qui en couvre 92,21 — mesuré le 18/09/2026
  # par « cargo llvm-cov --workspace --summary-only », mc-app compris, et non
  # recopié d'un commentaire. Deux points de marge, parce que ce seuil est là
  # pour arrêter une chute, pas pour rougir le jour où un test se déplace.
  #
  # L'arrivée de mc-app n'a pas fait le trou qu'on redoutait : le crate porte
  # 661 lignes de suites sidecar. Ce qu'aucun test ne peut atteindre s'y nomme
  # précisément — `run()`, qui demande un contexte graphique, et les sept
  # commandes Tauri, dont le corps ne se joue que derrière un pont.
  #
  # L'exigence des 80 % est ailleurs, et porte sur le code NOUVEAU : c'est la
  # porte de qualité de SonarQube Cloud, déclarée dans sonar-project.properties.
  # Les deux ne font plus double emploi qu'en apparence : celle-ci suit ce
  # qu'une PR écrit, celui-là ce que le dépôt a déjà.
  SEUIL_LIGNES: 90

jobs:
  couverture:
    name: Couverture et analyse Sonar
    # x86 et non ARM comme les contrôles : le scanner Sonar ne documente pas de
    # binaire aarch64-linux. Le prix est un cache de compilation distinct de
    # celui du workflow Contrôles ; le payer ici évite de découvrir la
    # limitation un jour de panne.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar date chaque ligne pour savoir laquelle est neuve. Sans
          # l'historique complet, tout le dépôt paraît écrit aujourd'hui : la
          # porte sur le code nouveau porterait alors sur le code de tout le
          # monde, et bloquerait la première PR venue.
          fetch-depth: 0

      # llvm-cov porte sur --workspace, donc sur mc-app, donc sur tauri : sans
      # WebKitGTK la mesure ne compile pas. C'est la contrepartie directe de
      # « default-members » — écarter mc-app de la sélection par défaut oblige
      # à le nommer partout où l'on veut le voir.
      - uses: ./.github/actions/dependances-linux

      # Une clé distincte de celle du workflow Contrôles, et c'est délibéré :
      # llvm-cov compile avec une instrumentation qui change les artefacts. Un
      # cache partagé ferait s'invalider mutuellement les deux workflows à
      # chaque exécution, et chacun recompilerait tout à chaque fois en croyant
      # profiter d'un cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # llvm-cov instrumente la compilation : les tests tournent donc une
      # seconde fois, après le workflow Contrôles. C'est le prix d'une mesure
      # exacte — l'alternative, compter les lignes exécutées sans
      # instrumentation, donne un chiffre qu'on ne peut pas opposer à quelqu'un.
      - name: Mesurer la couverture
        run: >
          cargo llvm-cov --workspace --locked
          --lcov --output-path lcov.info
          --fail-under-lines ${{ env.SEUIL_LIGNES }}

      # Le front entre dans le même périmètre Sonar que le Rust : voir
      # sonar-project.properties. Sans ce rapport, la porte des 80 % sur le
      # code nouveau porterait sur des fichiers dont Sonar ne saurait rien
      # couvert, et rougirait sur la première PR de la refonte.
      - uses: ./.github/actions/front

      - name: Mesurer la couverture du front
        working-directory: web
        run: pnpm test:couverture

      # vitest écrit des chemins relatifs à web/. Sonar les résout depuis la
      # racine du dépôt : sans cette réécriture il chercherait « src/app/… »
      # là où il n'y a que « crates/ », ne trouverait rien, et rapporterait
      # 0 % — sur le code même qu'on vient d'ajouter au périmètre. Un zéro qui
      # vient d'un chemin faux ne se distingue pas d'un zéro mérité.
      - name: Rendre les chemins du rapport front lisibles par Sonar
        run: |
          set -euo pipefail
          sed -i 's|^SF:src/|SF:web/src/|' web/coverage/launcher/lcov.info
          grep -c '^SF:web/src/' web/coverage/launcher/lcov.info

      # Conservé même quand le seuil n'est pas tenu : c'est précisément le cas
      # où l'on veut savoir quelle ligne manque.
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture-lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: warn

      # Le secret n'existe pas tant que le projet n'est pas créé sur
      # SonarQube Cloud. Sans cette garde, chaque PR échouerait sur une analyse
      # qu'on n'a pas les moyens de faire — alors que le seuil de couverture
      # ci-dessus, lui, tient déjà tout seul. Le test passe par le shell et non
      # par une expression : un secret absent et un secret vide se valent ici,
      # et aucune des deux valeurs n'apparaît dans le journal.
      - name: Le projet Sonar est-il configuré ?
        id: sonar
        env:
          JETON: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$JETON" ]; then
            echo "configure=true" >> "$GITHUB_OUTPUT"
          else
            echo "configure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyser avec SonarQube Cloud
        if: steps.sonar.outputs.configure == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar non configuré
        if: steps.sonar.outputs.configure != 'true'
        run: >
          echo "::notice title=Analyse Sonar ignorée::SONAR_TOKEN absent des
          secrets Actions. La couverture a été mesurée et le seuil appliqué ;
          seule l'analyse Sonar est passée. Marche à suivre dans
          sonar-project.properties."
